  <!-- Pencil Sketching Preloader -->
  <div id="preloader" class="preloader-scene">

  <div id="app" class="book-scene" style="opacity: 0;">

    <div class="book">

      <!-- Book Cover -->
      <div class="cover">
        <div class="cover-content">
          <h1 class="cover-title">Henston's Portfolio</h1>
          <p class="cover-subtitle">The Work journey of a Developer</p>
          <button class="cover-cta" id="btnStartStory">Start Reading</button>
        </div>
      </div>

      <!-- Left Bookmarks (Navbar Left) -->
      <div class="bookmarks-container left-side" id="portfolioLeftBookmarks">
        <button class="bookmark active" data-page="home" id="nav-home">Home</button>
      </div>

      <!-- Right Bookmarks (Navbar Right) -->
      <div class="bookmarks-container right-side" id="portfolioRightBookmarks">
        <button class="bookmark" data-page="home" id="nav-about">About</button>
        <button class="bookmark" data-page="skills" id="nav-skills">Skills</button>
        <button class="bookmark" data-page="experience" id="nav-experience">Experience</button>
        <button class="bookmark" data-page="projects" id="nav-projects">Projects</button>
        <button class="bookmark" data-page="contact" id="nav-contact">Contact</button>
      </div>

      <!-- Left Base Page -->
      <div class="page base-left-page">
        <div class="notebook-margin-line"></div>
        <div class="page-content" id="leftPageContainer">
          <!-- Content injected here -->
        </div>
      </div>

      <!-- Right Base Page -->
      <div class="page base-right-page">
        <div class="notebook-margin-line"></div>
        <div class="page-content" id="rightPageContainer">
          <!-- Content injected here -->
        </div>
      </div>

      <!-- Flipping Page (Dynamically used for transitions) -->
      <div class="page flip-page" style="display: none;">
        <!-- Front Face -->
        <div class="page-face front">
          <div class="notebook-margin-line"></div>
          <div class="page-content" id="flipFrontContainer">
          </div>
        </div>

        <!-- Back Face -->
        <div class="page-face back">
          <div class="notebook-margin-line"></div>
          <div class="page-content" id="flipBackContainer">
          </div>
        </div>
      </div>

    </div>
